<dsb-container-atom title="Icon" >
    <section class="d-flex gap-5" >
        @for(icon of icons; track icon){
            <dsb-icon-atom [icon]="icon.name" [size]="icon.size"></dsb-icon-atom>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Badge" >
    <section class="d-flex gap-2" >
        @for(badge of badges; track badge){
            <dsb-badge-atom [text]="badge.type | titlecase" [type]="badge.type" [typeText]="badge.typeText" ></dsb-badge-atom>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Button" >
    <section class="d-flex gap-2" >
        @for(button of buttons; track button){
            <dsb-button-atom 
                [idButton]="button.idButton" 
                [text]="button.type | titlecase" 
                [type]="button.type" 
                (clicker)="onClick($event)" >
            </dsb-button-atom>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Card" >
    <section class="d-flex gap-4" >
        @for(card of cards; track card){
            <dsb-card-atom [title]="card.title" [text]="card.text"></dsb-card-atom>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Input" >
    <section class="d-flex flex-column gap-2">
        @for(input of inputs; track input){
            <dsb-input-atom
                [id]="input.id"
                [label]="input.label"
                [placeholder]="input.placeholder"
                (changeValue)="onInputChange($event)">
            </dsb-input-atom>
        }
    </section>
</dsb-container-atom>

<dsb-container-atom title="Table Cells (Átomos)" >
    <section class="table-responsive">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th scope="col" dsb-header-cell-atom content="Id"></th>
                    <th scope="col" dsb-header-cell-atom content="Nombre"></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td dsb-cell-atom content="1"></td>
                    <td dsb-cell-atom content="Uceva Design System"></td>
                </tr>
                <tr>
                    <td dsb-cell-atom content="2"></td>
                    <td dsb-cell-atom content="Angular 20"></td>
                </tr>
            </tbody>
        </table>
    </section>
</dsb-container-atom>
