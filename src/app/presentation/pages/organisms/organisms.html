<dsb-container-atom title="Navbar" >
    <dsb-navbar-organism [navbarConfig]="navbarConfig"></dsb-navbar-organism>
</dsb-container-atom>

<dsb-container-atom title="Catalog" >
    <dsb-catalog-organism
        [cards]="catalogCards"
        placeholder="Buscar tarjetas..."
        (selectedCard)="onSelectCatalogCard($event)">
    </dsb-catalog-organism>
</dsb-container-atom>

<dsb-container-atom title="Table Organism" >
    <section class="table-responsive">
        <table dsb-table-organism
            [headers]="tableHeaders"
            [rows]="tableRows"
            [striped]="true"
            (selectedRow)="onSelectTableRow($event)">
        </table>
    </section>
</dsb-container-atom>
